name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-smoke:
    name: Build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Git for Windows ships usr\bin\link.exe (POSIX link(1)). Bash puts that
      # directory first on PATH, so rustc invokes it instead of MSVC link.exe.
      - name: Unshadow MSVC link.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitLink = 'C:\Program Files\Git\usr\bin\link.exe'
          if (Test-Path $gitLink) {
            Rename-Item -Path $gitLink -NewName 'link_unix.exe' -Force
            Write-Host "Renamed Git link.exe -> link_unix.exe"
          }
          Write-Host "link.exe => $((Get-Command link.exe).Source)"

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test

      - name: Prepare temp dir
        run: |
          echo "HYPER_TMP=${RUNNER_TEMP}/hyper_ci" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/hyper_ci"

      - name: Resolve exe helper
        run: |
          cat > "$HYPER_TMP/run_exe.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          bin="$1"
          shift || true
          if [[ -f "${bin}.exe" ]]; then
            exec "${bin}.exe" "$@"
          fi
          exec "$bin" "$@"
          EOF
          chmod +x "$HYPER_TMP/run_exe.sh"

      - name: Diff helper (ignore CRLF)
        run: |
          cat > "$HYPER_TMP/diff_lf.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          # Ignore CR so Windows AOT (CRLF) matches JIT (LF).
          diff -u <(tr -d '\r' < "$1") <(tr -d '\r' < "$2")
          EOF
          chmod +x "$HYPER_TMP/diff_lf.sh"

      - name: Run (JIT) smoke
        run: cargo run --quiet -- run ci/smoke.hyp

      - name: Shared list smoke
        run: |
          cargo run --quiet -- run ci/ref_list_share.hyp
          cargo run --quiet -- compile ci/ref_list_share.hyp

      - name: File I/O smoke
        run: |
          cargo run --quiet -- compile ci/io_compile.hyp
          rm -f ci_compile_io.txt

      - name: Compiler JIT smoke
        run: cargo run --quiet -- compile ci/smoke.hyp

      - name: Compiler JSON smoke
        run: |
          cargo run --quiet -- compile ci/json_compile.hyp
          rm -f ci_json_compile.json

      - name: Compiler mmap smoke
        run: |
          cargo run --quiet -- compile ci/mmap_compile.hyp
          rm -f ci_compile_mmap.txt

      - name: Compiler input smoke
        run: |
          printf 'hello\nworld\n' | cargo run --quiet -- compile ci/input_compile.hyp

      - name: Compiler clock smoke
        run: cargo run --quiet -- compile ci/clock_compile.hyp

      - name: Compiler collection methods smoke
        run: cargo run --quiet -- compile ci/collections_compile.hyp

      - name: Compiler dict hash-map smoke
        run: cargo run --quiet -- compile ci/dict_compile.hyp

      - name: Compiler string methods smoke
        run: cargo run --quiet -- compile ci/strings_compile.hyp

      - name: Break and continue smoke
        run: cargo run --quiet -- compile ci/break_continue.hyp

      - name: Raise and handle smoke
        run: |
          cargo run --quiet -- compile ci/raise_handle.hyp > "$HYPER_TMP/rh_jit.txt"
          cargo run --quiet -- run ci/raise_handle.hyp > "$HYPER_TMP/rh_run.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/rh_run.txt" "$HYPER_TMP/rh_jit.txt"

      - name: Traits smoke
        run: cargo run --quiet -- compile ci/traits_compile.hyp

      - name: Pub and mut smoke
        run: cargo run --quiet -- compile ci/pub_mut.hyp

      - name: Ref smoke
        run: cargo run --quiet -- compile ci/ref_compile.hyp

      - name: Vectorize and parallel smoke
        run: cargo run --quiet -- compile ci/vectorize_compile.hyp

      - name: Compiler emit-exe smoke
        run: |
          cargo run --quiet -- compile ci/smoke.hyp --emit-exe "$HYPER_TMP/hyper_smoke"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_smoke"

      - name: Compiler emit-exe collections smoke
        run: |
          cargo run --quiet -- compile ci/collections_compile.hyp --emit-exe "$HYPER_TMP/hyper_coll"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_coll"

      - name: Compiler emit-exe dict hash-map smoke
        run: |
          cargo run --quiet -- compile ci/dict_compile.hyp --emit-exe /tmp/hyper_dict
          /tmp/hyper_dict

      - name: Compiler emit-exe strings smoke
        run: |
          cargo run --quiet -- compile ci/strings_compile.hyp --emit-exe "$HYPER_TMP/hyper_str"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_str"

      - name: Compiler emit-exe break and continue smoke
        run: |
          cargo run --quiet -- compile ci/break_continue.hyp --emit-exe "$HYPER_TMP/hyper_bc"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_bc"

      - name: Compiler emit-exe raise and handle smoke
        run: |
          cargo run --quiet -- compile ci/raise_handle.hyp --emit-exe "$HYPER_TMP/hyper_rh"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_rh" > "$HYPER_TMP/rh_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/rh_jit.txt" "$HYPER_TMP/rh_exe.txt"

      - name: Division by zero
        run: |
          set +e
          cargo run --quiet -- run ci/divzero.hyp > "$HYPER_TMP/dz_run.txt" 2>&1
          run_code=$?
          cargo run --quiet -- compile ci/divzero.hyp > "$HYPER_TMP/dz_jit.txt" 2>&1
          jit_code=$?
          set -e
          test "$run_code" -eq 70
          test "$jit_code" -eq 70
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/dz_run.txt" "$HYPER_TMP/dz_jit.txt"

      - name: Run and compile output parity
        run: |
          cargo run --quiet -- run ci/smoke.hyp > "$HYPER_TMP/out_run.txt"
          cargo run --quiet -- compile ci/smoke.hyp > "$HYPER_TMP/out_jit.txt"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_smoke" > "$HYPER_TMP/out_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/out_run.txt" "$HYPER_TMP/out_jit.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/out_run.txt" "$HYPER_TMP/out_exe.txt"

      - name: Break and continue output parity
        run: |
          cargo run --quiet -- run ci/break_continue.hyp > "$HYPER_TMP/bc_run.txt"
          cargo run --quiet -- compile ci/break_continue.hyp > "$HYPER_TMP/bc_jit.txt"
          "$HYPER_TMP/run_exe.sh" "$HYPER_TMP/hyper_bc" > "$HYPER_TMP/bc_exe.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/bc_run.txt" "$HYPER_TMP/bc_jit.txt"
          "$HYPER_TMP/diff_lf.sh" "$HYPER_TMP/bc_run.txt" "$HYPER_TMP/bc_exe.txt"
